# Post-release attestation gate: after a release is published, run the full
# verification chain (key pin -> SSH signature -> checksum -> tag identity)
# against it and fail on any mismatch. See SECURITY.md "Release attestation".
name: verify-release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to verify (empty = latest)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  verify:
    name: verify the published release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # default branch, not the release tag: the verifier must exist even for
      # releases cut from tags that predate it (e.g. v0.2.0)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Run the attestation chain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: bash scripts/verify_release.sh "$RELEASE_TAG"
      - name: Keep the verification receipt with the run
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-release-receipt
          path: report/verify-release-*.json
          if-no-files-found: ignore
