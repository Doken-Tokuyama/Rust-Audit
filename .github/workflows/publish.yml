# Publish to PyPI when a release is published: `rust-audit`, one stdlib module
# plus its data, installing both commands (`rust-audit` and `rustaudit`).
#
# There is deliberately no second distribution for the one-word spelling:
# PyPI refuses `rustaudit` next to `rust-audit` with "This project name is too
# similar to an existing project", so an alias package can never exist there.
# The `rustaudit` command comes from this wheel's own entry point instead.
#
# Trusted publishing (OIDC): the `id-token: write` permission replaces an API
# token. Nothing secret lives in this repository and nothing needs rotating.
#
# One-time setup on PyPI — a pending publisher for the project, same claims:
#   https://pypi.org/manage/account/publishing/
#     owner:       Doken-Tokuyama
#     repository:  Rust-Audit
#     workflow:    publish.yml
#     environment: pypi
# A stale or missing entry fails with `invalid-publisher` and uploads nothing.
# The `pypi` environment must exist on the repository.
#
# The wheel ships scripts/rust_audit.py unchanged (the same file the signed
# GitHub asset carries), plus resources/ and templates/deny.toml as data.
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build distributions
    runs-on: ubuntu-latest
    # `id-token` + `attestations`: the build-provenance attestation below is
    # signed with this repository's OIDC identity and stored on GitHub. It is
    # what lets a user run `gh attestation verify` on the wheel they install.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # tags: the version guard below reads them
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Refuse to publish an untagged version
        # PyPI versions are immutable. A manual run from an untagged `main`
        # would upload the current VERSION with code that no signed release
        # asset vouches for — the exact mismatch this workflow exists to avoid.
        run: |
          version=$(python - <<'PY'
          import re
          src = open("scripts/rust_audit.py", encoding="utf-8").read()
          print(re.search(r'^VERSION = "([^"]+)"', src, re.M).group(1))
          PY
          )
          echo "VERSION = $version"
          git rev-parse "v$version" >/dev/null \
            || { echo "::error::v$version is not tagged: cut the release first (scripts/release.sh --cut)"; exit 1; }
          git show "v$version:scripts/rust_audit.py" > /tmp/tagged.py
          cmp -s /tmp/tagged.py scripts/rust_audit.py || {
            echo "::error::scripts/rust_audit.py differs from v$version — the wheel would not match the signed asset; bump the version and cut a release"
            exit 1
          }
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build --outdir dist/main
      - name: The wheel must contain the tool and its data
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          wheels = glob.glob("dist/main/*.whl")
          assert len(wheels) == 1, wheels
          names = zipfile.ZipFile(wheels[0]).namelist()
          required = ["rust_audit.py",
                      "data/share/rustaudit/resources/popular_crates.txt",
                      "data/share/rustaudit/resources/suspicious_names.txt",
                      "data/share/rustaudit/templates/deny.toml"]
          missing = [r for r in required
                     if not any(n.endswith(r) for n in names)]
          print("\n".join(names))
          sys.exit(f"wheel is missing: {missing}" if missing else 0)
          PY
      - name: The wheel installs and both commands self-test
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install --no-index \
            --find-links dist/main rust-audit
          /tmp/check/bin/pip show rust-audit | grep -E '^(Name|Version):'
          /tmp/check/bin/rust-audit selftest
          /tmp/check/bin/rustaudit selftest
      - name: Attest the built distributions
        # Binds each file's digest to this workflow run and repository, so the
        # PyPI wheel can be checked back to the build that produced it:
        #   gh attestation verify rust_audit-<version>-py3-none-any.whl \
        #     --repo Doken-Tokuyama/Rust-Audit
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/main/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    name: upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish rust-audit
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/main
