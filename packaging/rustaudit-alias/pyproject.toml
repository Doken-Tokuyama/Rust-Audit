# Alias distribution: reserves the PyPI name `rustaudit` and makes
# `pip install rustaudit` resolve to the real package. It installs no files of
# its own — no modules, no console scripts — so it can never shadow the
# `rust-audit` wheel it depends on.
#
# The floor is the release this alias was cut with; a lower bound (not an
# exact pin) means the alias keeps working across later releases without a
# re-publish. scripts/release.sh --cut raises it in lockstep.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rustaudit"
version = "0.2.3"
description = "Alias for rust-audit: installs the Rust Audit CLI under the one-word name"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Antonio Cantallops Alba", email = "contact@exyonq.org" }]
dependencies = ["rust-audit>=0.2.3"]

[project.urls]
Homepage = "https://github.com/Doken-Tokuyama/Rust-Audit"
Source = "https://github.com/Doken-Tokuyama/Rust-Audit"

# A metadata-only wheel: nothing to import, nothing to execute.
[tool.setuptools]
packages = []
